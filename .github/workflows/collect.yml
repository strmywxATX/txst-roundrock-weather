name: Collect observations

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes (GitHub may run a few minutes late)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and merge
        run: python collect.py
      - name: Commit new data
        run: |
          git config user.name "station-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new observations."
          else
            git commit -m "Observations through $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
